name: Run test suite

on: [pull_request]

jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3
      - name: Install dependencies
        uses: ./.github/actions/pnpm_install
      - name: Run tests
        run: pnpm --filter api run test
