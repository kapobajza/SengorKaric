name: Run API ESLint

on: [pull_request]

jobs:
  test:
    name: Run API ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install dependencies
        uses: ./.github/actions/pnpm_install
        
      - name: Run lint
        run: pnpm --filter api run lint
