pre-commit:
  parallel: true
  commands:
    prettier:
      files: git diff --name-only --staged
      glob: "*.{js,ts,jsx,tsx,json}"
      run: |
        node ./scripts/run_lefthook_cmd.js --cmd "npx" --args "prettier --write {files}" --files "{files}"
    lint:
      files: git diff --name-only --staged
      glob: "*.{js,ts,jsx,tsx}"
      run: |
        node ./scripts/run_lefthook_cmd.js --cmd "npx" --args "lefthook run lint" --files "{files}"

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit

lint:
  parallel: true
  commands:
    api:
      files: git diff --name-only --staged
      run: |
        node ./scripts/lint_relative_paths.js --path "apps/api"
    toolkit:
      files: git diff --name-only --staged
      run: |
        node ./scripts/lint_relative_paths.js --path "libs/toolkit"
    web:
      files: git diff --name-only --staged
      run: |
        node ./scripts/lint_relative_paths.js --path "apps/web"